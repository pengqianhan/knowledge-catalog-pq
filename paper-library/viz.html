/2605.22721__topics/multi-agent-systems", "source": "papers/2605.22721", "target": "topics/multi-agent-systems"}}, {"data": {"id": "papers/2605.22721__topics/agent-self-evolution", "source": "papers/2605.22721", "target": "topics/agent-self-evolution"}}, {"data": {"id": "papers/2605.22721__papers/2606.10662", "source": "papers/2605.22721", "target": "papers/2606.10662"}}, {"data": {"id": "papers/2605.22721__papers/2605.28655", "source": "papers/2605.22721", "target": "papers/2605.28655"}}, {"data": {"id": "papers/2605.28655__topics/ai-for-science", "source": "papers/2605.28655", "target": "topics/ai-for-science"}}, {"data": {"id": "papers/2605.28655__topics/multi-agent-systems", "source": "papers/2605.28655", "target": "topics/multi-agent-systems"}}, {"data": {"id": "papers/2605.28655__papers/2606.10662", "source": "papers/2605.28655", "target": "papers/2606.10662"}}, {"data": {"id": "papers/2605.28655__papers/2606.06741", "source": "papers/2605.28655", "target": "papers/2606.06741"}}, {"data": {"id": "papers/2606.06741__topics/llm-agents", "source": "papers/2606.06741", "target": "topics/llm-agents"}}, {"data": {"id": "papers/2606.06741__topics/agent-self-evolution", "source": "papers/2606.06741", "target": "topics/agent-self-evolution"}}, {"data": {"id": "papers/2606.06741__papers/2606.10662", "source": "papers/2606.06741", "target": "papers/2606.10662"}}, {"data": {"id": "papers/2606.06741__papers/2605.28655", "source": "papers/2606.06741", "target": "papers/2605.28655"}}, {"data": {"id": "papers/2606.10662__topics/multi-agent-systems", "source": "papers/2606.10662", "target": "topics/multi-agent-systems"}}, {"data": {"id": "papers/2606.10662__topics/llm-agents", "source": "papers/2606.10662", "target": "topics/llm-agents"}}, {"data": {"id": "papers/2606.10662__papers/2606.06741", "source": "papers/2606.10662", "target": "papers/2606.06741"}}, {"data": {"id": "papers/2606.10662__papers/2605.28655", "source": "papers/2606.10662", "target": "papers/2605.28655"}}, {"data": {"id": "papers/2606.13662__topics/ai-for-science", "source": "papers/2606.13662", "target": "topics/ai-for-science"}}, {"data": {"id": "papers/2606.13662__topics/llm-agents", "source": "papers/2606.13662", "target": "topics/llm-agents"}}, {"data": {"id": "papers/2606.13662__topics/agent-environment-engineering", "source": "papers/2606.13662", "target": "topics/agent-environment-engineering"}}, {"data": {"id": "papers/2606.13662__papers/2605.28655", "source": "papers/2606.13662", "target": "papers/2605.28655"}}, {"data": {"id": "papers/2606.13662__papers/2606.10662", "source": "papers/2606.13662", "target": "papers/2606.10662"}}, {"data": {"id": "topics/agent-environment-engineering__papers/2606.13662", "source": "topics/agent-environment-engineering", "target": "papers/2606.13662"}}, {"data": {"id": "topics/agent-self-evolution__papers/2606.06741", "source": "topics/agent-self-evolution", "target": "papers/2606.06741"}}, {"data": {"id": "topics/agent-self-evolution__papers/2605.22721", "source": "topics/agent-self-evolution", "target": "papers/2605.22721"}}, {"data": {"id": "topics/ai-for-science__papers/2605.28655", "source": "topics/ai-for-science", "target": "papers/2605.28655"}}, {"data": {"id": "topics/ai-for-science__papers/2606.13662", "source": "topics/ai-for-science", "target": "papers/2606.13662"}}, {"data": {"id": "topics/llm-agents__papers/2606.06741", "source": "topics/llm-agents", "target": "papers/2606.06741"}}, {"data": {"id": "topics/llm-agents__papers/2606.10662", "source": "topics/llm-agents", "target": "papers/2606.10662"}}, {"data": {"id": "topics/llm-agents__papers/2606.13662", "source": "topics/llm-agents", "target": "papers/2606.13662"}}, {"data": {"id": "topics/multi-agent-systems__papers/2606.10662", "source": "topics/multi-agent-systems", "target": "papers/2606.10662"}}, {"data": {"id": "topics/multi-agent-systems__papers/2605.28655", "source": "topics/multi-agent-systems", "target": "papers/2605.28655"}}, {"data": {"id": "topics/multi-agent-systems__papers/2605.22721", "source": "topics/multi-agent-systems", "target": "papers/2605.22721"}}], "bodies": {"papers/2605.22721": "# Summary\n\nThis paper introduces DecentMem, a decentralized memory framework for self-evolving multi-agent systems. Rather than sharing a single central memory repository across all agents, each agent maintains its own dual-pool memory: an **exploitation pool** of consolidated past trajectories, and an **exploration pool** of LLM-generated candidate responses for unseen contexts. An LLM-as-a-judge reweights the two pools online using stage-wise feedback.\n\nThe motivation is that centralized memory creates communication and coordination overhead, raises privacy concerns, and collapses agent diversity over time.\n\n# Key Ideas\n\n* Each agent keeps independent memory, eliminating cross-agent coordination overhead and preserving behavioral diversity.\n* Dual-pool design separates exploitation (reliable past solutions) from exploration (LLM-generated candidates for new contexts), allowing dynamic adaptation.\n* LLM-as-a-judge provides online reweighting of the two pools based on stage-wise performance feedback.\n* Theoretical analysis proves global reachability of the solution space and O(log T) cumulative regret, matching the stochastic bandit lower bound up to constants.\n\n# Method\n\nDecentMem assigns a dual-pool memory to every agent independently. During inference the agent queries both pools, and the LLM-as-a-judge scores each candidate to determine the pool mixing weight. Memory consolidation happens locally, avoiding synchronization across agents.\n\n# Experiments\n\n* Tested on three MAS frameworks: AutoGen, DyLAN, AgentNet.\n* Backbone models: Qwen3 (4B / 8B / 14B) and Gemma4 (E2B / E4B).\n* Five benchmarks spanning math, code, QA, and embodied tasks.\n* Improves average accuracy by up to 23.8% over the strongest centralized memory baseline.\n* Improves by up to 52.5% over a no-memory baseline.\n* Reduces token usage by up to 49% relative to centralized memory.\n\n# Limitations\n\n* Results depend on the quality of LLM-as-a-judge signals; a weak judge may misweight the two pools.\n* The exploration pool relies on LLM generation for unseen contexts, which may introduce hallucinated candidates.\n* Evaluation uses Qwen3 and Gemma4 families; generalization to other model families is not directly tested.\n\n# Notes\n\nReading questions:\n\n* How does the judge decide what counts as \"stage-wise feedback\" — is it task-level reward, step-level critique, or something else?\n* How do the exploitation and exploration pools interact when a context is only partially covered by past trajectories?\n* Does per-agent memory lead to inconsistent agent behaviors in tasks that require tight coordination?\n* How does DecentMem compare to 2606.10662 (DeLM), which uses decentralized agents with shared verified context instead of per-agent memory?\n\n# Related\n\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [Agent self-evolution](../topics/agent-self-evolution.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) — complementary decentralized design that uses shared context instead of per-agent memory.\n* [AutoScientists](2605.28655.md) — another self-organizing MAS paper in the library.\n\n# Citations\n\n[1] [arXiv:2605.22721](https://arxiv.org/abs/2605.22721)", "papers/2605.28655": "# Summary\n\nThis paper introduces AutoScientists, a decentralized team of AI agents for long-running computational scientific experimentation. The system is designed to sustain multiple research directions, adapt to new experimental evidence, and preserve knowledge about failed attempts.\n\nThe paper frames scientific research as an iterative loop of hypothesis generation, experiment design, execution, and revision. Its central claim is that self-organizing teams can explore this loop more effectively than a single trajectory or a centrally planned agent.\n\n# Key Ideas\n\n* Agents interpret a shared experimental state and organize into teams around promising hypotheses.\n* Proposals are critiqued before consuming experimental compute.\n* Successes and failures are shared to reduce redundant exploration.\n* The system targets long-running experiments where evidence changes over time.\n\n# Experiments\n\n* BioML-Bench: reports a mean leaderboard percentile of 74.4 across 24 tasks, improving over the strongest AI agent by 8.33 percentage points.\n* GPT training optimization: reports reaching target validation bits-per-byte 1.9x faster than Autoresearch.\n* ProteinGym ACE2-Spike binding: reports a 12.5 percent improvement in Spearman correlation over the prior state of the art.\n* ProteinGym full sweep: reports a 6.5 percent Spearman correlation improvement across 217 assays.\n\n# Notes\n\nReading questions:\n\n* What coordination mechanism lets teams form and dissolve without central planning?\n* How is failed experimental knowledge represented so later agents can reuse it?\n* Which ideas transfer from scientific experimentation to OKF paper-library curation and long-running literature review?\n\n# Related\n\n* [AI for science](../topics/ai-for-science.md)\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared-context coordination.\n* [OpenSkill](2606.06741.md) is relevant for agents building transferable skills from open-world resources.\n\n# Citations\n\n[1] [arXiv:2605.28655](https://arxiv.org/abs/2605.28655)", "papers/2606.06741": "# Summary\n\nThis paper introduces OpenSkill, a framework for open-world self-evolution of LLM agents. The core setting assumes the deployed agent receives only a task prompt and cannot rely on curated skills, successful trajectories, verifier signals, or target-task supervision.\n\nOpenSkill bootstraps a learning loop by acquiring grounded knowledge and verification anchors from documentation, repositories, and the web. It synthesizes those anchors into transferable skills, then refines the skills against self-built virtual tasks.\n\n# Key Ideas\n\n* Treat open-world resources as the source of both knowledge and practice environments.\n* Build skills and verification signals from scratch rather than assuming they already exist.\n* Reserve target-task supervision for final evaluation rather than training.\n* Test whether learned skills transfer across target agents and models.\n\n# Experiments\n\n* Reports best automated pass rate across three benchmarks and two target agents while satisfying the no-supervision constraint.\n* Reports that learned skills transfer across models without model-specific adaptation.\n* Reports that the self-built verifier aligns with ground-truth outcomes despite not accessing them during skill construction.\n\n# Notes\n\nReading questions:\n\n* What counts as a verification anchor, and how does the framework judge anchor quality?\n* How are generated skills represented and versioned?\n* Which parts of OpenSkill are directly applicable to an OKF `paper-library-manager` workflow?\n\n# Related\n\n* [LLM agents](../topics/llm-agents.md)\n* [Agent self-evolution](../topics/agent-self-evolution.md)\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is relevant for shared context and multi-agent execution.\n* [AutoScientists](2605.28655.md) is relevant for self-organized, long-running agent work.\n\n# Citations\n\n[1] [arXiv:2606.06741](https://arxiv.org/abs/2606.06741)", "papers/2606.10662": "# Summary\n\nThis paper introduces Decentralized Language Models (DeLM), a multi-agent system design where parallel agents coordinate through shared verified context and a task queue instead of a single central controller. Agents claim subtasks asynchronously, read accumulated progress, reason locally, and write compact verified updates back to the shared context.\n\nThe motivation is that centralized multi-agent orchestration can become a communication and integration bottleneck as the number of subtasks grows.\n\n# Key Ideas\n\n* Replace centralized task assignment and result merging with decentralized workers using a shared context substrate.\n* Keep shared context compact and verified so agents can build on prior progress without forwarding every update through a controller.\n* Use the design for test-time scaling in software engineering and long-context reasoning.\n\n# Experiments\n\n* SWE-bench Verified: reports best performance across Avg.@1, Pass@2, and Pass@4, with gains up to 10.5 percentage points over the strongest baseline.\n* Cost: reports roughly 50 percent lower cost per task.\n* LongBench-v2 Multi-Doc QA: reports highest average accuracy across four frontier model families, with gains up to 5.7 percentage points over the strongest baseline.\n\n# Notes\n\nReading questions:\n\n* What exactly qualifies an update as \"verified\" before it enters shared context?\n* How does DeLM prevent stale or contradictory context from degrading downstream agents?\n* Can this design inform OKF paper-library maintenance workflows, where many small updates need to merge into durable shared notes?\n\n# Related\n\n* [Multi-agent systems](../topics/multi-agent-systems.md)\n* [LLM agents](../topics/llm-agents.md)\n* [OpenSkill](2606.06741.md) also treats reusable skills and verification signals as durable artifacts for agents.\n* [AutoScientists](2605.28655.md) also uses decentralized agent teams, but for scientific experimentation rather than software-engineering test-time scaling.\n\n# Citations\n\n[1] [arXiv:2606.10662](https://arxiv.org/abs/2606.10662)", "papers/2606.13662": "# Summary\n\nThis paper introduces EurekAgent, an environment-engineered agent system for metric-driven autonomous scientific discovery. Its central argument is that as model capabilities improve, the bottleneck for autonomous discovery shifts from *prescribing agent workflows* to *designing agent environments*: the resources, constraints, and interfaces that shape agent behavior.\n\nThe authors frame this as **environment engineering** — building environments that amplify productive behaviors (open-ended exploration, systematic artifact management, inter-agent collaboration) while suppressing harmful ones (reward hacking, high-friction human oversight).\n\n# Key Ideas\n\n* Given an optimizable metric and an execution environment, LLM agents can propose, validate, and iterate solutions, sometimes beating human-designed approaches.\n* The paper reframes the open problem from \"what workflow should the agent follow\" to \"what environment should the agent act in.\"\n* Environment design is treated as a lever for both encouraging exploration and curbing failure modes such as reward hacking.\n\n# Method\n\nEurekAgent engineers the environment along four dimensions:\n\n* **Permissions engineering** — bounded agent execution and isolated evaluation.\n* **Artifact engineering** — filesystem and Git-based collaboration for managing artifacts.\n* **Budget engineering** — budget-aware exploration under cost constraints.\n* **Human-in-the-loop engineering** — easy human supervision and intervention.\n\n# Experiments\n\n* Reports new state-of-the-art results on multiple mathematics, kernel engineering, and machine learning tasks.\n* Highlights a new state-of-the-art 26-circle packing result discovered for less than $11 in total API cost.\n* Code and results are open-sourced (no repository URL captured from the abstract page).\n\n# Limitations\n\nNot yet assessed from the full text; the points below are reading flags rather than established critiques.\n\n* The four engineering dimensions are described at a system level in the abstract; the per-dimension ablations and how much each contributes are not yet verified here.\n* \"State-of-the-art on multiple tasks\" needs checking against which baselines and task selections.\n\n# Notes\n\nReading questions:\n\n* How does permissions/isolation engineering concretely prevent reward hacking versus simply detecting it after the fact?\n* How does the Git-based artifact substrate compare to shared-context approaches like DeLM for inter-agent collaboration?\n* The $11 / 26-circle-packing result is a striking cost claim — what is the full cost distribution across tasks, not just the headline?\n* Which environment-engineering ideas (permissions, artifacts, budget, human-in-the-loop) transfer to OKF library curation as an \"agent environment\"?\n\n# Related\n\n* [AI for science](../topics/ai-for-science.md)\n* [LLM agents](../topics/llm-agents.md)\n* [Agent environment engineering](../topics/agent-environment-engineering.md)\n* [AutoScientists](2605.28655.md) also targets autonomous scientific discovery, but emphasizes self-organizing agent teams rather than the environment those teams act in.\n* [Decentralized Multi-Agent Systems with Shared Context](2606.10662.md) is a complementary take on inter-agent collaboration via shared verified context instead of a Git/filesystem substrate.\n\n# Citations\n\n[1] [arXiv:2606.13662](https://arxiv.org/abs/2606.13662)", "topics/agent-environment-engineering": "# Scope\n\nThis topic tracks papers that treat the *environment* an agent acts in — its permissions, artifacts, budgets, interfaces, and oversight hooks — as the primary design surface, rather than the agent's prompt or workflow. It includes work on amplifying productive behaviors (exploration, artifact management, collaboration) and suppressing harmful ones (reward hacking, high-friction oversight).\n\n# Papers\n\n* [EurekAgent](../papers/2606.13662.md) - engineers the agent environment along permissions, artifact, budget, and human-in-the-loop dimensions for autonomous scientific discovery.\n\n# Open Questions\n\n* Which environment constraints reliably suppress reward hacking versus merely deferring it?\n* How do filesystem/Git artifact substrates compare to shared-context substrates for inter-agent collaboration?\n* How should budget engineering trade off open-ended exploration against cost ceilings?\n* What is the minimal human-in-the-loop interface that keeps oversight low-friction without bottlenecking the agent?", "topics/agent-self-evolution": "# Scope\n\nThis topic tracks papers about agents that adapt after deployment by building skills, generating practice tasks, creating verification signals, or revising behavior from open-world resources.\n\n# Papers\n\n* [OpenSkill](../papers/2606.06741.md) - builds transferable skills and self-built verification anchors from documentation, repositories, and the web without target-task supervision.\n* [Self-Evolving Multi-Agent Systems via Decentralized Memory](../papers/2605.22721.md) - per-agent dual-pool memory (exploit past trajectories + explore LLM-generated candidates) with LLM-as-a-judge reweighting for continual improvement.\n\n# Synthesis\n\nOpenSkill and DecentMem both target continual agent improvement but differ in mechanism: OpenSkill builds reusable skill objects from external resources, while DecentMem accumulates and reweights trajectory-level memory within a multi-agent system. The two approaches are complementary and could potentially be combined.\n\n# Open Questions\n\n* How should generated skills be represented so they remain reusable and auditable?\n* What makes a self-built verifier reliable enough to guide agent improvement?\n* How can self-evolution workflows avoid overfitting to synthetic practice tasks?\n* Does per-agent memory evolution in DecentMem lead to agents that specialize or diverge in ways that reduce team coherence?\n", "topics/ai-for-science": "# Scope\n\nThis topic tracks papers about AI systems used to plan, run, and revise scientific experiments over repeated cycles.\n\n# Papers\n\n* [AutoScientists](../papers/2605.28655.md) - self-organizing agent teams for long-running computational scientific experimentation.\n* [EurekAgent](../papers/2606.13662.md) - environment-engineered agent system for metric-driven autonomous scientific discovery.\n\n# Synthesis\n\n* AutoScientists and EurekAgent both target autonomous discovery but locate the leverage differently: AutoScientists in self-organizing team structure, EurekAgent in the environment (permissions, artifacts, budget, oversight) the agents act within.\n\n# Open Questions\n\n* How should failed experiments be captured so future agents avoid repeating them?\n* Which parts of scientific experimentation map onto long-running literature review workflows?\n* How should compute budgets shape agent critique and proposal acceptance?\n", "topics/llm-agents": "# Scope\n\nThis topic tracks papers about LLM agents that execute tasks, build reusable skills, use verification signals, or coordinate with other agents.\n\n# Papers\n\n* [OpenSkill](../papers/2606.06741.md) - open-world self-evolution through skills and self-built verification anchors.\n* [Decentralized Multi-Agent Systems with Shared Context](../papers/2606.10662.md) - multi-agent test-time scaling through shared verified context.\n* [EurekAgent](../papers/2606.13662.md) - shapes agent behavior through engineered environments rather than prescribed workflows.\n\n# Open Questions\n\n* What should a durable agent skill contain, and what should stay in the knowledge base?\n* How should agents validate generated skills before using them on real tasks?\n* How do skills, shared context, and OKF documents reinforce each other?\n", "topics/multi-agent-systems": "# Scope\n\nThis topic tracks papers where multiple agents coordinate reasoning, experimentation, or execution through shared state, task allocation, critique, or self-organization.\n\n# Papers\n\n* [Decentralized Multi-Agent Systems with Shared Context](../papers/2606.10662.md) - decentralized coordination through shared verified context and task queues.\n* [AutoScientists](../papers/2605.28655.md) - self-organizing agent teams for long-running scientific experimentation.\n* [Self-Evolving Multi-Agent Systems via Decentralized Memory](../papers/2605.22721.md) - per-agent dual-pool memory that outperforms centralized memory by up to 23.8% while cutting token usage by 49%.\n\n# Synthesis\n\nTwo complementary decentralization strategies appear in this set: 2606.10662 (DeLM) decentralizes agents while keeping a single shared verified context, whereas 2605.22721 (DecentMem) keeps context centralized per-agent and decentralizes memory. The trade-off is coordination overhead vs. agent diversity — shared context enables tight coherence; per-agent memory preserves behavioral variation and reduces synchronization cost.\n\n# Open Questions\n\n* How should shared state be represented so agents can reuse it without creating integration bottlenecks?\n* When is decentralized coordination better than a central planner?\n* What safeguards are needed when multiple agents update durable knowledge artifacts?\n* How do per-agent memory and shared-context approaches interact when combined in a single system?\n"}, "types": ["Paper", "Topic"], "palette": {"Paper": "#2563eb", "Topic": "#16a34a", "Reference": "#9333ea"}};
    window.BUNDLE_NAME = "Paper Library";
    const bundle = window.BUNDLE;
    const nodesEl = document.getElementById("nodes");
    const searchEl = document.getElementById("search");
    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("description");
    const bodyEl = document.getElementById("body");
    const metaEl = document.getElementById("meta");
    document.getElementById("bundle-name").textContent = window.BUNDLE_NAME;
    document.getElementById("summary").textContent = `${bundle.nodes.length} concepts, ${bundle.edges.length} links`;

    function showNode(node) {
      const data = node.data;
      titleEl.textContent = data.label || data.id;
      descEl.textContent = data.description || "";
      bodyEl.textContent = bundle.bodies[data.id] || "";
      metaEl.innerHTML = "";
      [data.type, data.resource, ...(data.tags || [])].filter(Boolean).forEach(value => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = value;
        metaEl.appendChild(pill);
      });
    }

    function render() {
      const query = searchEl.value.toLowerCase();
      nodesEl.innerHTML = "";
      bundle.nodes
        .filter(node => JSON.stringify(node.data).toLowerCase().includes(query))
        .sort((a, b) => (a.data.label || a.data.id).localeCompare(b.data.label || b.data.id))
        .forEach(node => {
          const button = document.createElement("button");
          button.className = "node";
          button.style.setProperty("--node-color", node.data.color || "#64748b");
          button.innerHTML = `<strong>${node.data.label || node.data.id}</strong><span>${node.data.type || "Concept"} · ${node.data.id}</span>`;
          button.addEventListener("click", () => showNode(node));
          nodesEl.appendChild(button);
        });
    }

    searchEl.addEventListener("input", render);
    render();
    if (bundle.nodes[0]) showNode(bundle.nodes[0]);
  </script>
